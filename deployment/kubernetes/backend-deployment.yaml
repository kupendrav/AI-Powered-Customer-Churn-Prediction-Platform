apiVersion: apps/v1
kind: Deployment
metadata:
  name: churnai-backend
  labels:
    app: churnai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churnai-backend
  template:
    metadata:
      labels:
        app: churnai-backend
    spec:
      containers:
        - name: backend
          image: churnai-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: churnai-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: churnai-secrets
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: churnai-backend-svc
spec:
  selector:
    app: churnai-backend
  ports:
    - port: 8000
      targetPort: 8000
