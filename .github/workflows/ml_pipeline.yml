name: ML Pipeline

on:
  push:
    branches: [main]
    paths:
      - "ml/**"
      - "datasets/**"
  workflow_dispatch:
    inputs:
      retrain:
        description: "Force retrain model"
        required: false
        default: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML deps
        run: |
          pip install pandas numpy scikit-learn xgboost lightgbm imbalanced-learn joblib pytest

      - name: Test preprocessing
        run: pytest tests/ml/ -v --tb=short

      - name: Generate dataset
        run: python datasets/dataset_generator.py

      - name: Train model
        if: github.event.inputs.retrain == 'true' || github.event_name == 'push'
        run: python -m ml.pipelines.training_pipeline

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          path: ml/artifacts/
          retention-days: 30
